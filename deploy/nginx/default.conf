server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # See security-headers.conf for why this is also re-included below.
    include /etc/nginx/security-headers.conf;

    # Simple liveness check for container/orchestrator health checks.
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets are safe to cache aggressively.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so SPA deploys are picked up.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: any unmatched route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (e.g. stray .env/.git) even though the build
    # output shouldn't contain any.
    location ~ /\. {
        deny all;
    }
}
