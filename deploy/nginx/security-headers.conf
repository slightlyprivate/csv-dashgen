# Security headers for Spread Your Sheets.
#
# Included at the server level *and* re-included inside any location that
# sets its own add_header (e.g. /assets/, /index.html) — nginx only inherits
# add_header directives from the closest block when that block defines none
# of its own, so a location with even one add_header must repeat all of
# these or it silently loses them.

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://analytics.slightlyprivate.com; connect-src 'self' https://analytics.slightlyprivate.com; upgrade-insecure-requests;" always;
