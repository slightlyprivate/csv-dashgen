version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "slightlyprivate"
    assignees:
      - "slightlyprivate"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Routine dev-dependency minor bumps land in one PR instead of one per
      # package. Patch bumps are already ignored below; majors (and the pins
      # further down) are excluded so they still surface individually for
      # manual review.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # Ignore major version updates for React (handle manually)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Ignore major version updates for TypeScript (handle manually)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Ignore major version updates for Vite (handle manually)
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6.x requires vite ^8.0.0; keep it pinned to
      # vite's major line until vite itself is upgraded.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react's latest release (7.37.5) caps its peer dep at
      # eslint ^9.7; ESLint 10 isn't installable until that plugin catches up.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # lint-staged 17 requires Node >=22.22.1; this repo runs Node 20 in CI
      # and locally. Revisit once the project's Node baseline moves to 22+.
      - dependency-name: "lint-staged"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "slightlyprivate"
    assignees:
      - "slightlyprivate"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
