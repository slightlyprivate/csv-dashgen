name: Docker Build and Publish

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: slightlyprivate/spread-your-sheets-web

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          cd web
          npm ci
      - name: Lint
        run: |
          cd web
          npm run lint
      - name: Test
        run: |
          cd web
          npm run test -- --run
      - name: Build
        run: |
          cd web
          npm run build

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag
        id: vars
        run: echo "sha_tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
          build-args: |
            VITE_PUBLIC_ENV=production
            VITE_INDEXABLE=true
            VITE_CANONICAL_URL=https://spreadyoursheets.slightlyprivate.com
            VITE_ANALYTICS_ENABLED=${{ vars.VITE_ANALYTICS_ENABLED || 'false' }}
            VITE_ANALYTICS_SRC=${{ vars.VITE_ANALYTICS_SRC || 'https://analytics.slightlyprivate.com/fetch.js' }}
            VITE_ANALYTICS_WEBSITE_ID=${{ vars.VITE_ANALYTICS_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
